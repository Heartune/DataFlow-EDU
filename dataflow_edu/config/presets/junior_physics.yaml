subject: 初中物理
grade: 初中
default_difficulty_distribution:
  易: 0.3
  中: 0.5
  难: 0.2
taxonomy:
- name: 运动与力学
  subcategories:
  - 机械运动
  - 长度时间测量
  - 力与牛顿定律
  - 二力平衡与摩擦力
- name: 声光现象
  subcategories:
  - 声现象
  - 光的直线传播与反射
  - 光的折射与色散
  - 透镜及其应用
- name: 热学与物态变化
  subcategories:
  - 温度与热量
  - 物态变化
  - 分子动理论
  - 内能与热机
- name: 压强与浮力
  subcategories:
  - 压强
  - 液体的压强
  - 大气压强
  - 浮力与阿基米德原理
- name: 电与磁及能源
  subcategories:
  - 电流电路
  - 电压电阻与欧姆定律
  - 电功率与生活用电
  - 磁现象与电磁感应
  - 能源与可持续发展
question_types:
- name: 选择题
  weight: 0.12
- name: 填空题
  weight: 0.12
- name: 判断题
  weight: 0.08
- name: 简答题
  weight: 0.22
- name: 计算题
  weight: 0.23
- name: 综合题
  weight: 0.23
ability_levels:
- name: 物理观念
  weight: 0.25
  description: 形成物质、运动、相互作用、能量等物理观念，并能解释现象和解决问题
  sublevels:
  - 物质观念
  - 运动观念
  - 相互作用观念
  - 能量观念
- name: 科学思维
  weight: 0.25
  description: 运用模型建构、科学推理、科学论证、质疑创新等方法认识物理规律
  sublevels:
  - 模型建构
  - 科学推理
  - 科学论证
  - 质疑创新
- name: 科学探究
  weight: 0.25
  description: 提出问题、设计实验、获取证据、得出结论并交流评估
  sublevels:
  - 提出问题与假设
  - 实验设计与操作
  - 数据获取与分析
  - 结论交流与评估
- name: 科学态度与责任
  weight: 0.25
  description: 认识科学本质，理解科学·技术·社会·环境（STSE）关系，形成正确态度和责任感
  sublevels:
  - 科学本质认识
  - STSE关系理解
  - 实事求是精神
  - 社会责任意识
operators:
  mineru_ocr:
    img_dir: dataflow_edu/data/resources/img
    md_dir: dataflow_edu/data/resources/md
    batch_size: 50
    poll_interval: 5
    poll_timeout: 600
    skip_existing: true
    language: ch
    enable_formula: true
    enable_table: true
  generation:
    md_dir: dataflow_edu/data/resources/md
    output_dir: dataflow_edu/data/generation_and_balancing
    questions_per_pair: 5
    max_workers: 8
    api_delay: 0.3
    request_timeout: 120
    max_retries: 3
    save_interval: 5
  balancing:
    output_dir: dataflow_edu/data/generation_and_balancing
    sample_size: 32
    max_iterations: 30
    questions_per_round: 10
    max_per_sublevel_iterations: 2
    tolerance: 0.03
    excluded_ability_sublevels: []
  ambiguity_cleaning:
    input_dir: dataflow_edu/data/generation_and_balancing/2_2_balanced
    output_dir: dataflow_edu/data/cleaning_and_refinement/3_1_ambiguity_cleaned
    max_workers: 8
    max_retries: 3
    threshold_remove: 1
  ambiguity_refinement:
    input_dir: dataflow_edu/data/cleaning_and_refinement/3_1_ambiguity_cleaned
    output_dir: dataflow_edu/data/cleaning_and_refinement/3_2_ambiguity_refined
    max_workers: 8
    max_retries: 3
    target_scores: [2, 3]
  domain_cleaning:
    input_dir: dataflow_edu/data/cleaning_and_refinement/3_2_ambiguity_refined
    output_dir: dataflow_edu/data/cleaning_and_refinement/3_3_domain_cleaned
    max_workers: 8
    max_retries: 3
    threshold_remove: 1
    domain_name: 初中物理
  domain_refinement:
    input_dir: dataflow_edu/data/cleaning_and_refinement/3_3_domain_cleaned
    output_dir: dataflow_edu/data/cleaning_and_refinement/3_4_domain_refined
    max_workers: 8
    max_retries: 3
    target_scores: [2, 3]
    domain_name: 初中物理
  deduplication:
    input_dir: dataflow_edu/data/cleaning_and_refinement/3_4_domain_refined
    output_dir: dataflow_edu/data/cleaning_and_refinement/3_5_deduplicated
    threshold: 0.9
    num_perm: 128
    n_gram: 5
  synthesis:
    input_dir: dataflow_edu/data/cleaning_and_refinement/3_5_deduplicated
    output_dir: dataflow_edu/data/cleaning_and_refinement/3_6_synthesized
    max_workers: 8
    max_retries: 3
    max_tokens: 2000
    temperature: 0.3
    skip_existing: true
  translation:
    input_dir: dataflow_edu/data/cleaning_and_refinement/3_6_synthesized
    output_dir: dataflow_edu/data/cleaning_and_refinement/3_7_translated
    target_languages:
    - en
    - fr
    translate_fields:
    - question
    - answer
    - output
    - explanation
    - options
    max_workers: 8
    max_retries: 3
    residual_pattern_zh: true
    fix_french_option_letter: true
  mcq_verify:
    input_dir: dataflow_edu/data/cleaning_and_refinement/3_7_translated
    output_dir: dataflow_edu/data/cleaning_and_refinement/3_8_mcq_verified
    target_languages:
    - zh
    - en
    - fr
    max_workers: 8
    max_retries: 3
    max_tokens: 2000
    temperature: 0.3
  execute:
    input_dir: dataflow_edu/data/cleaning_and_refinement/3_5_deduplicated
    output_dir: dataflow_edu/data/execute_and_judge/4_1_executed
