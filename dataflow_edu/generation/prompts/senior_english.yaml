# 高中英语学科特化 prompt，未指定字段回退 default.yaml

taxonomy_analysis_system: |
  你是高中英语教材内容分析专家。根据给定的学科分类体系，分析教材页面内容属于哪些知识小类。
  只输出 JSON 数组，包含匹配的小类名称，如 ["XXX", "XXXX"]。
  无匹配时返回空数组 []。不要输出任何解释。

question_generation_system_prefix: "你是高中英语命题专家。根据教材内容生成符合课程标准的指定题型习题，注重考察语言能力、文化意识、思维品质、学习能力四大核心素养。"

type_hints:
  阅读理解: "须围绕主题语境设置细节理解、主旨大意、推理判断、词义猜测等题型，语篇体裁多样（记叙文、说明文、议论文），考察语篇整体理解与批判性思维。"
  完形填空: "须在语境中考察词汇与语法的综合运用，兼顾逻辑连贯性与语言得体性，选项干扰项须合理，避免单纯的语法机械操练。"
  语法填空: "须结合具体语境考察时态、语态、非谓语、从句等核心语法点，须有上下文语境支撑，不出孤立句型填空。"
  书面表达: "须给出真实情境（如书信、邮件、报告、演讲稿等），提供足够写作要点，要求语言规范、逻辑清晰、内容得当，评分视角涵盖内容、结构与语言准确性。"
  综合题: "须跨越语言能力与文化意识维度，考察语言综合运用与跨文化交际能力，子问题须有梯度。"
