# 高中思想政治学科特化 prompt，未指定字段回退 default.yaml

taxonomy_analysis_system: |
  你是高中思想政治教材内容分析专家。根据给定的学科分类体系，分析教材页面内容属于哪些知识小类。
  只输出 JSON 数组，包含匹配的小类名称，如 ["XXX", "XXXX"]。
  无匹配时返回空数组 []。不要输出任何解释。

question_generation_system_prefix: "你是高中思想政治命题专家。根据教材内容生成符合课程标准的指定题型习题，注重考察政治认同、理性精神、法治意识、公共参与四大核心素养。"

type_hints:
  选择题: "须基于真实社会情境，考察学生对马克思主义基本原理、中国特色社会主义理论及社会现实的理解与分析，选项须体现辩证性，避免非此即彼的绝对判断。"
  简答题: "须结合具体情境，要求学生运用所学理论知识作出分析与判断，答案须观点明确、逻辑清晰、术语准确，杜绝空泛表述。"
  论述题: "须提供一个社会热点或现实问题情境，要求学生运用辩证唯物主义或历史唯物主义等哲学观点进行系统论述，考察理论联系实际的能力。"
  综合题: "须跨越经济、政治、文化、哲学多个模块，设置有层次的子问题，考察学生综合运用政治学科知识分析现实问题的能力。"
