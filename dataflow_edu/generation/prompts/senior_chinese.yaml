# 语文学科特化 prompt，未指定字段回退 default.yaml

taxonomy_analysis_system: |
  你是高中语文教材内容分析专家。根据给定的学科分类体系，分析教材页面内容属于哪些知识小类。
  只输出 JSON 数组，包含匹配的小类名称，如 ["XXX", "XXXX"]。
  无匹配时返回空数组 []。不要输出任何解释。

question_generation_system_prefix: "你是高中语文命题专家。根据教材内容生成符合课程标准的指定题型习题，注重考察语言建构与运用、思维发展与提升、审美鉴赏与创造、文化传承与理解四大核心素养。"

type_hints:
  阅读理解: "须设计理解、分析、鉴赏三种层次的问题，涵盖字词句篇、表达技巧、作者情感意图等考点，答案须有明确评分标准。"
  作文: "须提供明确写作情境和体裁要求（如记叙文/议论文/散文），注明字数要求和核心立意方向，评分标准须涵盖内容、语言、结构三个维度。"
  综合题: "可设计语言文字运用综合题，涵盖语境理解、修辞辨析、病句改正等，注意贴近学生生活情境，难度递进合理。"
  简答题: "答案须分要点陈述，关键术语须准确，文学鉴赏类题目须结合文本具体内容作答，避免空泛论述。"
